<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<!-- 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Login App</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3">
                <strong th:text="${member.name}">사용자</strong>님 환영합니다
                <span class="badge bg-light text-primary ms-1" th:text="${member.role}">ROLE</span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<!-- 메인 콘텐츠 -->
<div class="container mt-4">
    <!-- 내 정보 카드 -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">내 정보</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <strong>아이디</strong>
                            <p class="text-muted" th:text="${member.username}">username</p>
                        </div>
                        <div class="col-md-3">
                            <strong>이름</strong>
                            <p class="text-muted" th:text="${member.name}">name</p>
                        </div>
                        <div class="col-md-3">
                            <strong>이메일</strong>
                            <p class="text-muted" th:text="${member.email} ?: '미등록'">email</p>
                        </div>
                        <div class="col-md-3">
                            <strong>가입일</strong>
                            <p class="text-muted" th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}">date</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 세션 정보 카드 -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card shadow-sm border-start border-4 border-warning">
                <div class="card-header bg-white">
                    <h5 class="mb-0">세션 정보</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <strong>세션 ID</strong>
                            <p class="text-muted text-break" th:text="${sessionId}">session-id</p>
                        </div>
                        <div class="col-md-4">
                            <strong>세션 생성 시간</strong>
                            <p class="text-muted" th:text="${#temporals.format(sessionCreated, 'yyyy-MM-dd HH:mm:ss')}">time</p>
                        </div>
                        <div class="col-md-4">
                            <strong>세션 만료</strong>
                            <p class="text-muted" th:text="${sessionTimeout} + '분'">30분</p>
                        </div>
                    </div>
                    <small class="text-secondary">로그아웃 시 이 세션이 무효화(invalidate)되며, 다시 로그인하면 새로운 세션 ID가 발급됩니다.</small>
                </div>
            </div>
        </div>
    </div>

    <!-- 회원 목록 테이블 -->
    <div class="row">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">회원 목록</h5>
                    <span class="badge bg-primary" th:text="'총 ' + ${members.size()} + '명'">총 0명</span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>번호</th>
                                <th>아이디</th>
                                <th>이름</th>
                                <th>이메일</th>
                                <th>권한</th>
                                <th>가입일</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m, stat : ${members}">
                                <td th:text="${stat.index + 1}">1</td>
                                <td th:text="${m.username}">username</td>
                                <td th:text="${m.name}">name</td>
                                <td th:text="${m.email} ?: '-'">email</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${m.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                                          th:text="${m.role}">ROLE</span>
                                </td>
                                <td th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}">date</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
